name: terraform

# Runs on PRs (plan only) and on merge to main (apply).
on:
  pull_request:
  push:
    branches: [main]

# OIDC federation to Azure - GitHub gets a short-lived token, no stored password.
permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan (PRs)
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # Apply only after merge to main. For real enterprises this step is
      # additionally gated by a protected GitHub "Environment" requiring approval.
      - name: Apply (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
